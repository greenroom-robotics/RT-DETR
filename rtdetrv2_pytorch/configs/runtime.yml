
print_freq: 100
output_dir: './logs'
checkpoint_freq: 1

early_stopping:
  enabled: True
  patience: 10
  min_delta: 0.001 

sync_bn: True
find_unused_parameters: False


use_amp: False
scaler:
  type: GradScaler
  enabled: True


use_ema: False
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000
