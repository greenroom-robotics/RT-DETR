__include__: [
  '../dataset/gr_detection.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
  '../runtime.yml',
]


# Horizon band EO detector, proof of concept. See platform_perception/horizon-detection-plan.md.
#
# The full-frame model stretches 2560x1280 into 1280x1280, so a 6 px vessel arrives as ~3 px.
# This model reads a 2560x320 strip at NATIVE pixel scale instead, and runs beside the
# full-frame model rather than replacing it. 0.50x the pixels of the square model.
#
# Warm-started from angry-mare-613 (rtdetrv2.rgb.leidos@challenger v3)
#   -c "https://mlflow.ml.grr.dev/get-artifact?path=pytorch_model%2Fbest.pth&run_uuid=11b4a29bad564efd85d4d863a34a8aa8"
#
# The head is NOT aligned: that model runs 9 classes, this one runs 3. Measured on the real
# checkpoint, 527 tensors transfer and 11 do not:
#   decoder.anchors, decoder.valid_mask          - spatial buffers, rebuilt at 320x2560
#   decoder.denoising_class_embed.weight         - sized by num_classes
#   decoder.enc_score_head.*, dec_score_head.*   - the classifier, re-initialised
# So `missed` must be EMPTY and `unmatched` must be exactly those 11. Anything else means the
# config diverged from the checkpoint's architecture and the run is training more from scratch
# than intended. Nothing fails if this goes wrong, so read the log.
#
# v2. Run 1 (powerful-hawk-290) showed the fine-tune is CLASSIFICATION limited, not
# localisation limited. Over 5 epochs:
#     loss_bbox  0.668 -> 0.058   box regression learned well
#     loss_giou  1.740 -> 0.590   boxes are good
#     loss_vfl   0.237 -> 0.481   classification got WORSE
#     AP50 flat at 0.002, AR 0.007
# The model finds the objects and cannot rank them, which is what a from-scratch classifier
# does when it trains at the same rate as a pretrained backbone. Two changes follow.
num_classes: 4 # 3 classes (vessel, marker, unknown) + 1  [map_3cls]
epoches: 30

# Data is the ipanema 2560x1280 subset of e26-008, cropped to a 640-row strip centred on row
# 654. That row is measured, not assumed: over the ipanema labels a 320-row band there holds
# 97.1% of all boxes and 99.9% of the boxes 8 px and under. The binned innovator batches
# (1440x928) are excluded on resolution, because they carry the same targets at half the
# pixels and would teach the model the wrong apparent size.
#
# Train keeps its 1593 negatives, val drops them: an empty image in validation trips the
# per-epoch pycocotools evaluation.
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /mnt/lakefs/datasets/eo/experiments/e26-014-d26-006-horizon-band-poc
    ann_file: /mnt/lakefs/datasets/eo/experiments/e26-014-d26-006-horizon-band-poc/coco_labels/split_train.mapped.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        # NO Resize, NO RandomZoomOut, NO RandomIoUCrop. All three change scale, and native
        # scale is the only reason this model exists. RandomBandCrop takes the 320-row network
        # input out of the 640-row stored strip, so it changes position and never size.
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomBandCrop, height: 320}
        - {type: RandomHorizontalFlip}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        # The inherited policy lists RandomZoomOut and RandomIoUCrop, which this config
        # removes, and stop_epoch matches on class name. Restate it, or the switch does
        # nothing at all.
        name: stop_epoch
        epoch: 27   # epoches - 3
        ops: ['RandomPhotometricDistort']
  collate_fn:
    type: BatchImageCollateFuncion
    scales: ~   # multi-scale is another scale changer, and it lives outside `transforms`
  # 8, not 12. gr-sim-sydney's GPU is shared, and a perception_eval run holds ~2.7 GB of the
  # 16 GB. At 12 this run took 10.0 GB and left only 3.4 GB free, which validation at a larger
  # batch would have eaten. 8 leaves room for the other job.
  total_batch_size: 8
  shuffle: True
  num_workers: 4
  drop_last: True

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /mnt/lakefs/datasets/eo/experiments/e26-014-d26-006-horizon-band-poc
    ann_file: /mnt/lakefs/datasets/eo/experiments/e26-014-d26-006-horizon-band-poc/coco_labels/split_test.mapped.json
    return_masks: False
    transforms:
      type: Compose
      ops:
        # Deterministic, so a score is comparable between epochs and between runs.
        - {type: CenterBandCrop, height: 320}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  total_batch_size: 8
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFuncion


PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


RTDETRTransformerv2:
  num_layers: 3

optimizer:
  type: AdamW
  params:
    # The classifier and the denoising class embedding are the ONLY tensors that did not
    # transfer from angry-mare-613, so they start random while everything around them is
    # trained. 10x the base rate lets them catch up. Groups must be mutually exclusive:
    # get_optim_params asserts every parameter is visited exactly once, and a score head
    # carries no `norm` or `bn` in its name, so this does not overlap the group below.
    -
      params: '^(?=.*(?:score_head|denoising_class_embed)).*$'
      lr: 0.001
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

# Warmup was 2000 steps against 598 steps per epoch, so the run spent its first 3.3 epochs
# below the target rate, which is most of the budget a fresh head has to converge in.
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500

# [height, width]. Rectangular, and the reason export_onnx.py had to stop assuming a square.
# At strides 8/16/32 this gives 320x40 + 160x20 + 80x10 = 16800 anchors.
eval_spatial_size: [320, 2560]
